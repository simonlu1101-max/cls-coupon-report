<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>优惠券统计报表 · 手机版</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --text:#1f2733; --muted:#6b7686; --line:#e4e8ee; --brand:#2f6fed; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif; }
  .page { max-width:920px; margin:0 auto; padding:16px 14px 32px; }
  header h1 { font-size:20px; margin:0 0 4px; }
  header p { margin:0; color:var(--muted); font-size:12px; }
  .kpis { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:16px 0; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .kpi .label { color:var(--muted); font-size:12px; }
  .kpi .value { font-size:21px; font-weight:700; margin-top:4px; }
  .kpi .sub { color:var(--muted); font-size:11px; margin-top:2px; }
  .controls { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .field { flex:1 1 100%; }
  .field.half { flex:1 1 calc(50% - 5px); }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:#fff; color:var(--text); appearance:none; }
  input:focus, select:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(47,111,237,.12); }
  .quick { display:flex; gap:8px; flex-wrap:wrap; }
  .quick button { border:1px solid var(--line); background:#fff; color:var(--text); padding:8px 12px; border-radius:999px; font-size:13px; }
  .quick button.active { background:var(--brand-soft,#eaf1ff); border-color:var(--brand); color:var(--brand); font-weight:600; }
  .table-wrap { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  thead th { text-align:left; padding:10px 12px; background:#fafbfc; color:var(--muted); font-weight:600; white-space:nowrap; }
  tbody td { padding:11px 12px; border-top:1px solid var(--line); vertical-align:top; }
  .name { font-weight:600; line-height:1.4; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .rate-cell { display:flex; align-items:center; gap:8px; }
  .bar { flex:1; height:8px; background:#eef1f5; border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#2f6fed,#7aa5ff); border-radius:99px; }
  .rate-val { min-width:48px; text-align:right; color:var(--brand); font-weight:700; }
  .empty { padding:28px; text-align:center; color:var(--muted); }
  .section-title { font-size:14px; font-weight:700; margin:14px 0 8px; }
  .rank-list { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px 0; margin-bottom:12px; overflow:hidden; }
  .rank-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--line); }
  .rank-item:first-child { border-top:none; }
  .rank-no { width:22px; height:22px; border-radius:8px; background:#eef1f5; color:#6b7686; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none; }
  .rank-no.top { background:var(--brand); color:#fff; }
  .rank-main { flex:1; min-width:0; }
  .rank-name { font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .rank-bar-wrap { height:6px; background:#eef1f5; border-radius:99px; overflow:hidden; margin-top:5px; }
  .rank-bar { height:100%; background:linear-gradient(90deg,#2f6fed,#7aa5ff); border-radius:99px; }
  .rank-used { text-align:right; flex:none; min-width:56px; font-weight:700; font-variant-numeric:tabular-nums; }
  .rank-rate { text-align:right; flex:none; min-width:70px; font-weight:700; color:var(--brand); font-variant-numeric:tabular-nums; }
  @media (max-width:600px) {
    .kpi .value { font-size:18px; }
    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table { width:100%; min-width:360px; table-layout:fixed; font-size:12px; }
    th, td { padding:6px 4px; }
    th:nth-child(1), td:nth-child(1) { width:12%; font-size:11px; }
    th:nth-child(2), td:nth-child(2) { width:31%; }
    th:nth-child(3), td:nth-child(3) { width:20%; text-align:right; }
    th:nth-child(4), td:nth-child(4) { width:20%; text-align:right; }
    th:nth-child(5), td:nth-child(5) { width:17%; }
    .name { font-size:12px; line-height:1.35; word-break:break-word; }
    .num { font-size:11px; }
    .rate-cell { gap:2px; }
    .bar { min-width:6px; }
    .rate-val { min-width:36px; font-size:11px; }
    .rank-name { font-size:13px; }
    .rank-item { padding:9px 10px; gap:8px; }
  }

  .chat-fab { position:fixed; right:16px; bottom:18px; width:54px; height:54px; border-radius:50%; background:var(--brand); color:#fff; border:none; box-shadow:0 6px 18px rgba(0,0,0,.18); font-size:24px; z-index:99; cursor:pointer; }
  .chat-panel { position:fixed; right:14px; bottom:84px; width:min(340px, calc(100vw - 28px)); max-height:72vh; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 32px rgba(0,0,0,.18); display:none; flex-direction:column; overflow:hidden; z-index:100; }
  .chat-panel.open { display:flex; }
  .chat-head { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); background:#fafbfc; }
  .chat-head span { font-weight:700; }
  .chat-head button { border:none; background:none; font-size:20px; cursor:pointer; color:var(--muted); }
  .chat-msgs { flex:1; overflow-y:auto; padding:12px; min-height:150px; white-space:pre-wrap; }
  .msg { margin-bottom:10px; padding:9px 11px; border-radius:12px; font-size:14px; line-height:1.5; max-width:92%; }
  .msg.user { background:var(--brand); color:#fff; margin-left:auto; }
  .msg.bot { background:#f1f4f8; }
  .chat-quick { display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 8px; }
  .chat-quick button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 10px; font-size:12px; color:var(--text); }
  .chat-input { display:flex; align-items:center; gap:6px; padding:10px 12px; border-top:1px solid var(--line); }
  .chat-input input { flex:1; min-width:0; border:1px solid var(--line); border-radius:999px; padding:8px 12px; font-size:14px; }
  .chat-input button { border:none; border-radius:999px; padding:8px 12px; font-size:14px; cursor:pointer; }
  #chatMic { background:#f1f4f8; }
  #chatMic.listening { background:#ffe3e3; color:#d33; }
  #chatSend { background:var(--brand); color:#fff; }
</style>
</head>

      <div class="field half"><label for="sortDir">排序方向</label><select id="sortDir"><option value="desc" selected>从高到低</option><option value="asc">从低到高</option></select></div>
    </div>
  </div>

  <div class="section-title">使用数量排名</div>
  <div class="rank-list" id="rankList"></div>

  <div class="section-title">核销率排名</div>

  <div class="table-wrap">

    </table>

  </div>
</div>

const MIN_DATE = '2026-09-01';
const MAX_DATE = '2026-09-12';
const dateSort = (a,b) => a.localeCompare(b);
const uniqueDates = [...new Set(DATA.map(r => r.date))].sort(dateSort);
const fmt = n => new Intl.NumberFormat('zh-CN').format(n);

function isoDaysAgo(n) {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - n);
  const p = x => String(x).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}

function monthRange(offset) {
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() + offset, 1);
  const last = new Date(now.getFullYear(), now.getMonth() + offset + 1, 0);
  const p = x => String(x).padStart(2,'0');
  const f = d => d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  return [f(first), f(last)];
}

function setRange(start, end) {
  document.getElementById('startDate').value = start;
  document.getElementById('endDate').value = end;
  render();
}

document.querySelectorAll('.quick button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.quick button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const r = btn.dataset.range;
    if (r === 'all') setRange(MIN_DATE, MAX_DATE);
    else if (r === 'yesterday') { const y = isoDaysAgo(1); setRange(y, y); }
    else if (r === 'month') { const m = monthRange(0); setRange(m[0], MAX_DATE); }
    else if (r === 'lastMonth') { const m = monthRange(-1); setRange(m[0], m[1]); }
    else { const mon = isoDaysAgo((new Date().getDay() + 6) % 7); const sun = isoDaysAgo(0); setRange(mon, sun); }
  });
});

document.getElementById('startDate').addEventListener('change', render);
document.getElementById('endDate').addEventListener('change', render);
document.getElementById('search').addEventListener('input', render);
document.getElementById('sortBy').addEventListener('change', render);
document.getElementById('sortDir').addEventListener('change', render);

function render() {
  const start = document.getElementById('startDate').value || MIN_DATE;
  const end = document.getElementById('endDate').value || MAX_DATE;
  const q = document.getElementById('search').value.trim().toLowerCase();
  const sortBy = document.getElementById('sortBy').value;
  const sortDir = document.getElementById('sortDir').value;

  const filtered = DATA.filter(r => r.date >= start && r.date <= end);
  const days = new Set(filtered.map(r => r.date));
  const map = new Map();
  for (const r of filtered) {
    const key = r.id;
    if (!map.has(key)) map.set(key, { id:r.id, name:r.name, issued:0, used:0 });
    const g = map.get(key);
    g.issued += r.issued;
    g.used += r.used;
  }
  let rows = [...map.values()];
  rows = rows.filter(r => !q || (r.name + ' ' + r.id).toLowerCase().includes(q));
  const mult = sortDir === 'asc' ? 1 : -1;
  rows = rows.sort((a,b) => sortBy === 'name' ? a.name.localeCompare(b.name,'zh-Hans-CN')*mult : ((a[sortBy]||0)-(b[sortBy]||0))*mult);

  const cum = new Map();
  for (const r of DATA) {
    if (r.date > end) continue;
    const c = cum.get(r.id) || { issued:0, used:0 };
    c.issued += r.issued;
    c.used += r.used;
    cum.set(r.id, c);
  }
  let cumIssuedTotal = 0, cumUsedTotal = 0;
  for (const c of cum.values()) {
    cumIssuedTotal += c.issued;
    cumUsedTotal += c.used;
  }

  const ranked = [...rows].sort((a,b)=>b.used-a.used).slice(0,10);
  const maxUsed = ranked.length ? ranked[0].used : 0;
  const rankList = document.getElementById('rankList');
  rankList.innerHTML = '';
  ranked.forEach((r, idx) => {
    const c = cum.get(r.id) || { issued:0, used:0 };
    const cumRate = c.issued ? c.used/c.issued*100 : 0;
    const div = document.createElement('div');
    div.className = 'rank-item';
    div.innerHTML = '<div class="rank-no' + (idx < 3 ? ' top' : '') + '">' + (idx+1) + '</div>' +
      '<div class="rank-main"><div class="rank-name">' + r.name + '</div><div class="rank-meta">区间发放 ' + fmt(r.issued) + ' · 累计核销率 ' + cumRate.toFixed(2) + '%</div>' +
      '<div class="rank-bar-wrap"><div class="rank-bar" style="width:' + (maxUsed ? r.used/maxUsed*100 : 0) + '%"></div></div></div>' +
      '<div class="rank-used">' + fmt(r.used) + '</div>';
    rankList.appendChild(div);
  });

  const rateRanked = [...rows].map(r => {
    const c = cum.get(r.id) || { issued:0, used:0 };
    return { ...r, rate: c.issued ? c.used/c.issued*100 : 0 };
  }).sort((a,b)=>b.rate-a.rate).slice(0,10);
  const maxRateRank = rateRanked.length ? rateRanked[0].rate : 0;
  const rateRankList = document.getElementById('rateRankList');
  rateRankList.innerHTML = '';
  rateRanked.forEach((r, idx) => {
    const c = cum.get(r.id) || { issued:0, used:0 };
    const div = document.createElement('div');
    div.className = 'rank-item';
    div.innerHTML = '<div class="rank-no' + (idx < 3 ? ' top' : '') + '">' + (idx+1) + '</div>' +
      '<div class="rank-main"><div class="rank-name">' + r.name + '</div><div class="rank-meta">累计发放 ' + fmt(c.issued) + ' · 累计使用 ' + fmt(c.used) + '</div>' +
      '<div class="rank-bar-wrap"><div class="rank-bar" style="width:' + (maxRateRank ? r.rate/maxRateRank*100 : 0) + '%"></div></div></div>' +
      '<div class="rank-rate">' + r.rate.toFixed(2) + '%</div>';
    rateRankList.appendChild(div);
  });

  const issued = rows.reduce((s,r)=>s+r.issued,0);
  const used = rows.reduce((s,r)=>s+r.used,0);
  const overallRate = cumIssuedTotal ? cumUsedTotal/cumIssuedTotal*100 : 0;

  document.getElementById('kpiDays').textContent = fmt(days.size);
  document.getElementById('kpiTypes').textContent = fmt(rows.length);
  document.getElementById('kpiIssued').textContent = fmt(issued);
  document.getElementById('kpiUsed').textContent = fmt(used);
  document.getElementById('kpiRate').textContent = overallRate.toFixed(2) + '%';

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const maxRate = Math.max(...rows.map(r => { const c = cum.get(r.id) || {issued:0, used:0}; return c.issued ? c.used/c.issued*100 : 0; }), 0.0001);
  for (const r of rows) {
    const c = cum.get(r.id) || { issued:0, used:0 };
    const rate = c.issued ? c.used/c.issued*100 : 0;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + r.id + '</td><td class="name">' + r.name + '</td><td class="num">' + fmt(r.issued) + '</td><td class="num">' + fmt(r.used) + '</td><td><div class="rate-cell"><div class="bar"><i style="width:' + Math.min(100, rate/maxRate*100) + '%"></i></div><div class="rate-val">' + rate.toFixed(2) + '%</div></div></td>';
    tbody.appendChild(tr);
  }
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
}

function init() {
  const lastMonth = monthRange(-1);
  const today = isoDaysAgo(0);
  document.getElementById('startDate').min = lastMonth[0];
  document.getElementById('startDate').max = today;
  document.getElementById('endDate').min = lastMonth[0];
  document.getElementById('endDate').max = today;
  document.getElementById('startDate').value = MIN_DATE;
  document.getElementById('endDate').value = MAX_DATE;
  render();
}
init();

        if(metric==='rate'){
          var ca=cum[a.id]||{issued:0,used:0}; var cb=cum[b.id]||{issued:0,used:0};
          var ra=ca.issued?ca.used/ca.issued*100:0; var rb=cb.issued?cb.used/cb.issued*100:0;
          return lowest?ra-rb:rb-ra;
        }
        return lowest?(a[metric]-b[metric]):(b[metric]-a[metric]);
      });
      arr=arr.slice(0,topN);
      var label=metric==='rate'?'核销率':(metric==='issued'?'发放数量':'使用数量');
      var parts=[];
      arr.forEach(function(x,idx){
        var val;
        if(metric==='rate'){ var c=cum[x.id]||{issued:0,used:0}; val=(c.issued?c.used/c.issued*100:0).toFixed(2)+'%'; }
        else { val=fmt(x[metric]); }
        parts.push((idx+1)+'. '+x.name+'：'+val);
      });
      return start+'~'+end+' '+label+(lowest?'倒数':'')+'排名：\n'+parts.join('\n');
    }

    if(/(平均核销率|整体核销率)/.test(q)){
      var ci=0,cu=0; for(var k in cum){ ci+=cum[k].issued; cu+=cum[k].used; }
      var rate=ci?cu/ci*100:0;
      return start+'~'+end+' 平均核销率为 '+rate.toFixed(2)+'%。';
    }
    if(wantIssued){ return start+'~'+end+' 发放数量合计 '+fmt(totalIssued)+'。'; }
    if(/(使用|核销)/.test(q)){ return start+'~'+end+' 使用数量合计 '+fmt(totalUsed)+'，覆盖 '+fmt(Object.keys(days).length)+' 天、'+fmt(list.length)+' 种券。'; }
    return '可以这样问我：\n· 昨天使用数量排名\n· 本月平均核销率\n· 核销率最高的券\n· 9月1日到9月5日发放数量';
  }

  function send(q, fromVoice){
    if(!q){ return; }
    addMsg('user', q);
    var a=answer(q);
    addMsg('bot', a);
    if(fromVoice){ speak(a); }
  }
  sendBtn.addEventListener('click', function(){ var q=textInput.value.trim(); textInput.value=''; send(q,false); });
  textInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ var q=textInput.value.trim(); textInput.value=''; send(q,false); } });
  document.querySelectorAll('#chatQuick button').forEach(function(b){
    b.addEventListener('click', function(){ send(b.textContent, false); });
  });

  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var rec=null; var listening=false; var listenTimer=null;
  if(SR){ rec=new SR(); rec.lang='zh-CN'; rec.interimResults=false; rec.maxAlternatives=1; rec.continuous=false; }
  function stopListening(msg){
    if(listenTimer){ clearTimeout(listenTimer); listenTimer=null; }
    listening=false;
    micBtn.classList.remove('listening');
    micBtn.textContent='🎤';
    if(msg){ addMsg('bot', msg); }
  }
  micBtn.addEventListener('click', function(){
    if(!rec){ addMsg('bot','当前浏览器不支持语音输入，请改用文字输入，或用 Chrome/Edge/Safari 打开。'); return; }
    if(listening){ try{ rec.stop(); }catch(e){} stopListening(); return; }
    listening=true;
    micBtn.classList.add('listening');
    micBtn.textContent='●';
    addMsg('bot','正在聆听，请说话…');
    listenTimer=setTimeout(function(){
      try{ rec.stop(); }catch(e){}
      stopListening('没有听到声音，请检查麦克风权限后重试。');
    }, 12000);
    try{
      rec.start();
    }catch(e){
      stopListening('无法启动麦克风，请检查浏览器麦克风权限。');
    }
  });
  if(rec){
    rec.onresult=function(e){
      if(listenTimer){ clearTimeout(listenTimer); listenTimer=null; }
      var t='';
      for(var i=0;i<e.results.length;i++){ if(e.results[i] && e.results[i][0]){ t+=e.results[i][0].transcript; } }
      if(t){ textInput.value=''; send(t, true); }
      else { stopListening('没有识别到内容，请重试。'); }
    };
    rec.onerror=function(e){
      var err=(e && e.error) || '';
      var msg='语音识别失败：'+err+'。请重试或改用文字输入。';
      if(err==='not-allowed' || err==='service-not-allowed'){ msg='麦克风权限被拒绝，请在浏览器设置中允许麦克风。'; }
      else if(err==='no-speech'){ msg='没有检测到语音，请靠近麦克风再试。'; }
      else if(err==='network'){ msg='语音识别网络异常，请检查网络后重试。'; }
      stopListening(msg);
    };
    rec.onend=function(){ if(listening){ stopListening(); } };
  }

  fab.addEventListener('click', function(){
    panel.classList.toggle('open');
    if(panel.classList.contains('open') && msgs.children.length===0){
      addMsg('bot','你好，我可以帮你查询和分析优惠券数据。可以点下面的问题，也可以直接说话提问。');
    }
  });
  document.getElementById('chatClose').addEventListener('click', function(){ panel.classList.remove('open'); });
})();
</script>
