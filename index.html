<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>优惠券统计报表 · 手机版</title>
<style>
  :root { --bg:#f4f6f9; --card:#ffffff; --text:#1f2733; --muted:#6b7686; --line:#e4e8ee; --brand:#2f6fed; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif; }
  .page { max-width:920px; margin:0 auto; padding:16px 14px 32px; }
  header h1 { font-size:20px; margin:0 0 4px; }
  header p { margin:0; color:var(--muted); font-size:12px; }
  .kpis { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:16px 0; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .kpi .label { color:var(--muted); font-size:12px; }
  .kpi .value { font-size:22px; font-weight:700; margin-top:4px; }
  .kpi .sub { color:var(--muted); font-size:11px; margin-top:2px; }
  .controls { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .field { flex:1 1 100%; }
  .field.half { flex:1 1 calc(50% - 5px); }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; background:#fff; color:var(--text); appearance:none; }
  input:focus, select:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(47,111,237,.12); }
  .table-wrap { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  thead th { text-align:left; padding:10px 12px; background:#fafbfc; color:var(--muted); font-weight:600; white-space:nowrap; }
  tbody td { padding:11px 12px; border-top:1px solid var(--line); vertical-align:top; }
  .name { font-weight:600; line-height:1.4; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .rate-cell { display:flex; align-items:center; gap:8px; }
  .bar { flex:1; height:8px; background:#eef1f5; border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#2f6fed,#7aa5ff); border-radius:99px; }
  .rate-val { min-width:48px; text-align:right; color:var(--brand); font-weight:700; }
  .empty { padding:28px; text-align:center; color:var(--muted); }
  @media (max-width:600px) { .kpi .value { font-size:19px; } th, td { padding:9px 8px; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>优惠券统计报表</h1>
    <p>统计周期：本周 · 生成时间：2026-09-05 21:56</p>
  </header>
  <div class="kpis">
    <div class="kpi"><div class="label">券类型数</div><div class="value" id="kpiTypes">-</div><div class="sub">当前筛选结果</div></div>
    <div class="kpi"><div class="label">发放数量</div><div class="value" id="kpiIssued">-</div><div class="sub">优惠券发放总数</div></div>
    <div class="kpi"><div class="label">使用数量</div><div class="value" id="kpiUsed">-</div><div class="sub">优惠券使用总数</div></div>
    <div class="kpi"><div class="label">平均核销率</div><div class="value" id="kpiRate">-</div><div class="sub">使用数量 ÷ 发放数量</div></div>
  </div>
  <div class="controls">
    <div class="row">
      <div class="field"><label for="search">搜索</label><input id="search" type="search" placeholder="输入券类型名称或编号"></div>
    </div>
    <div class="row" style="margin-top:10px;">
      <div class="field half"><label for="sortBy">排序字段</label><select id="sortBy"><option value="name">券类型名称</option><option value="issued" selected>发放数量</option><option value="used">使用数量</option><option value="rate">平均核销率</option></select></div>
      <div class="field half"><label for="sortDir">排序方向</label><select id="sortDir"><option value="desc" selected>从高到低</option><option value="asc">从低到高</option></select></div>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>编号</th><th>券类型名称</th><th style="text-align:right;">发放数量</th><th style="text-align:right;">使用数量</th><th style="text-align:right;">核销率</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">没有匹配的数据</div>
  </div>
</div>
<script>
const DATA = [{"id": "66007", "name": "小芝士蛋糕配草莓酱券（点单页面直接兑换）|Free Berry cheesecake", "issued": 155, "used": 6, "rate": 3.87}, {"id": "66009", "name": "免费冰淇淋球一份", "issued": 6, "used": 2, "rate": 33.33}, {"id": "66010", "name": "任意儿童餐享半价优惠", "issued": 13, "used": 4, "rate": 30.77}, {"id": "66012", "name": "免费开心莓果（任意消费）", "issued": 104485, "used": 87, "rate": 0.08}, {"id": "66013", "name": "驰名巧克力熔岩蛋糕半价券", "issued": 104485, "used": 68, "rate": 0.07}, {"id": "66014", "name": "100-50元满减券", "issued": 104713, "used": 399, "rate": 0.38}, {"id": "66015", "name": "38元无门槛代金券", "issued": 14975, "used": 94, "rate": 0.63}];
function fmt(n) { return new Intl.NumberFormat('zh-CN').format(n); }
function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const sortBy = document.getElementById('sortBy').value;
  const sortDir = document.getElementById('sortDir').value;
  let rows = DATA.filter(r => !q || (r.name + ' ' + r.id).toLowerCase().includes(q));
  const mult = sortDir === 'asc' ? 1 : -1;
  rows = rows.slice().sort((a,b) => sortBy === 'name' ? a.name.localeCompare(b.name,'zh-Hans-CN')*mult : (a[sortBy]-b[sortBy])*mult);
  const issued = rows.reduce((s,r)=>s+r.issued,0);
  const used = rows.reduce((s,r)=>s+r.used,0);
  const rate = issued ? used/issued*100 : 0;
  document.getElementById('kpiTypes').textContent = fmt(rows.length);
  document.getElementById('kpiIssued').textContent = fmt(issued);
  document.getElementById('kpiUsed').textContent = fmt(used);
  document.getElementById('kpiRate').textContent = rate.toFixed(2) + '%';
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const maxRate = Math.max(...rows.map(r=>r.rate), 0.0001);
  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + r.id + '</td><td class="name">' + r.name + '</td><td class="num">' + fmt(r.issued) + '</td><td class="num">' + fmt(r.used) + '</td><td><div class="rate-cell"><div class="bar"><i style="width:' + Math.min(100, r.rate/maxRate*100) + '%"></i></div><div class="rate-val">' + r.rate.toFixed(2) + '%</div></div></td>';
    tbody.appendChild(tr);
  }
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
}
document.getElementById('search').addEventListener('input', render);
document.getElementById('sortBy').addEventListener('change', render);
document.getElementById('sortDir').addEventListener('change', render);
render();
</script>
</body>
</html>
